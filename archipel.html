<html lang="fr">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>L'Archipel des Savoirs</title>
<style>
:root{--ink:#1e1b4b;--muted:#5b5f86;--card:#ffffff;--line:#e0e7ff;--go:#22c55e;--go2:#16a34a;--ko:#ef4444;--hint:#fef3c7}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:"Nunito","Trebuchet MS",system-ui,sans-serif;font-size:19px;color:var(--ink);background:linear-gradient(180deg,#7dd3fc 0%,#bae6fd 45%,#e0f2fe 100%) fixed;overflow-x:hidden}
body:before,body:after{content:"☁️";position:fixed;font-size:90px;opacity:.55;top:60px;left:-120px;animation:cloud 60s linear infinite;z-index:0;pointer-events:none}
body:after{top:220px;font-size:60px;animation-duration:85s;animation-delay:-30s}
@keyframes cloud{to{transform:translateX(calc(100vw + 260px))}}
#app{position:relative;z-index:1;max-width:860px;margin:0 auto;padding:12px 16px 60px}
h1,h2,h3,.big,.iname,.lvt{font-family:"Fredoka","Trebuchet MS",system-ui,sans-serif}
h1{font-size:2.3rem;margin:4px 0;color:#fff;text-shadow:0 3px 0 #0369a1,0 6px 14px rgba(3,105,161,.35);letter-spacing:.5px;text-align:center}
h2{font-size:1.5rem;margin:6px 0 10px}h3{font-size:1.2rem;margin:4px 0 8px}
button{font:inherit;color:inherit;cursor:pointer}
.card{background:var(--card);border-radius:24px;padding:20px;margin:14px 0;box-shadow:0 8px 0 rgba(30,27,75,.08),0 12px 30px rgba(30,27,75,.12)}
.pop{animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0}
.who{display:flex;align-items:center;gap:8px;background:#fff;border:none;border-radius:40px;padding:4px 14px 4px 4px;font-weight:800;box-shadow:0 4px 0 rgba(30,27,75,.12)}
.ava{font-size:30px;width:44px;height:44px;display:grid;place-items:center;background:#fef3c7;border-radius:50%}
.topr{display:flex;gap:6px;align-items:center}
.pill{background:#fff;border-radius:40px;padding:8px 14px;font-weight:800;box-shadow:0 4px 0 rgba(30,27,75,.12)}
.pill.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.35) rotate(-6deg);background:#fde047}}
.ic{background:#fff;border:none;border-radius:14px;padding:8px 10px;font-size:20px;box-shadow:0 4px 0 rgba(30,27,75,.12)}
.ic.sm{font-size:18px;padding:6px 9px}
.ic:active,.big:active,.opt:active,.island:active,.level:active,.pad button:active{transform:translateY(3px);box-shadow:none}
.hero{text-align:center;margin:6px 0 4px}.hero.small p{color:var(--ink);font-weight:700}
.mascot{display:flex;align-items:flex-end;gap:10px;justify-content:center;margin:6px 0}
.bubble{position:relative;background:#fff;border-radius:22px;padding:12px 16px;font-weight:800;max-width:420px;text-align:left;box-shadow:0 6px 0 rgba(30,27,75,.08)}
.bubble:before{content:"";position:absolute;left:-12px;bottom:22px;border:8px solid transparent;border-right:14px solid #fff;border-left:0}
.owl{flex:none;animation:bob 3s ease-in-out infinite}.owl.wow,.owl.party{animation:jump .7s ease-in-out 2}
@keyframes bob{50%{transform:translateY(-6px) rotate(-2deg)}}@keyframes jump{50%{transform:translateY(-14px) scale(1.06)}}
.islands{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin:16px 0}
.island{position:relative;border:none;border-radius:42% 58% 50% 50%/55% 45% 55% 45%;background:radial-gradient(circle at 50% 35%,#fff 0%,var(--s) 55%,#fde68a 56%,#fcd34d 70%);padding:26px 18px 30px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 10px 0 #38bdf8,0 18px 30px rgba(3,105,161,.3);animation:float 4s ease-in-out infinite;transition:transform .15s}
.island:hover{transform:scale(1.04) rotate(-1deg)}
@keyframes float{50%{translate:0 -8px}}
.iemo{font-size:62px;filter:drop-shadow(0 4px 2px rgba(0,0,0,.15))}
.iname{font-size:1.2rem;font-weight:700;color:var(--c)}
.idesc{font-size:.85rem;font-weight:700;color:var(--muted)}
.imed{font-size:1.3rem;letter-spacing:4px;margin-top:4px}
.mapbtns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.big{border:none;border-radius:18px;padding:14px 22px;font-size:1.15rem;font-weight:700;background:#fff;box-shadow:0 6px 0 rgba(30,27,75,.15)}
.big.go{background:var(--go);color:#fff;box-shadow:0 6px 0 var(--go2)}
.big.go.alt{background:#8b5cf6;box-shadow:0 6px 0 #6d28d9}
.big.defi{background:linear-gradient(135deg,#ec4899,#f59e0b);color:#fff;box-shadow:0 6px 0 #be185d}
.big.ghost{background:#fff;color:var(--ink)}
.sea{height:40px;margin:20px -16px 0;background:repeating-radial-gradient(circle at 20px -10px,#38bdf8 0 18px,#0ea5e9 19px 22px,transparent 23px) 0 0/40px 40px;opacity:.6;animation:waves 6s linear infinite}
@keyframes waves{to{background-position:80px 0}}
.foot{text-align:center;margin-top:16px}.link{background:none;border:none;text-decoration:underline;color:#075985;font-weight:800}
.welcome{max-width:560px;margin:40px auto;text-align:center}
.lbl{display:block;font-weight:800;margin:14px 0 8px;text-align:left}
.lbl input{display:block;width:100%;margin-top:6px;font:inherit;font-size:1.3rem;padding:12px 16px;border-radius:16px;border:3px solid var(--line)}
.lbl input:focus{outline:none;border-color:#8b5cf6}
.avas{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:18px}
.avab{font-size:34px;background:#f1f5f9;border:3px solid transparent;border-radius:16px;padding:6px}.avab.on{border-color:#8b5cf6;background:#ede9fe;transform:scale(1.08)}
.lvhead{text-align:center;background:var(--s);border-radius:28px;padding:14px;border:4px solid var(--c)}.lvhead h2{color:var(--c);margin:0}.lvhead p{margin:4px 0;font-weight:700}
.method .steps4{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}.method .steps4 span{background:#eff6ff;border-radius:16px;padding:10px;font-size:1.6rem;text-align:center}.method .steps4 b{display:block;font-size:1rem}
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.level{border:4px solid var(--c);background:#fff;border-radius:24px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;box-shadow:0 8px 0 var(--c)}
.lvemo{font-size:48px}.lvt{font-size:1.05rem}.lvt b{font-size:1.3rem;color:var(--c)}.lvd{font-size:.9rem;color:var(--muted);font-weight:700}.lvm{font-size:.85rem;font-weight:800;margin-top:4px}
.playhead{display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--s);border:3px solid var(--c);border-radius:20px;padding:8px 12px;font-weight:800;color:var(--c)}
.dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.dot{min-width:34px;height:34px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:.9rem;color:var(--muted);border:3px solid #fff}
.dot.cur{border-color:var(--c);transform:scale(1.15);color:var(--ink)}
.qtools{display:flex;gap:8px;align-items:center;justify-content:flex-end}.qtools .tag{margin-right:auto}
.tag{background:#eef2ff;color:#4338ca;font-weight:800;font-size:.85rem;border-radius:20px;padding:4px 12px}
.qtext{font-family:"Fredoka",system-ui,sans-serif;font-size:1.55rem;font-weight:600;margin:14px 2px;line-height:1.35}
.vis{display:flex;flex-direction:column;align-items:center;margin:8px 0 14px}
.vis-cap{font-size:.8rem;color:var(--muted);font-weight:700;text-align:center;margin-top:6px}
.emo{font-size:76px;line-height:1;animation:bob 3s ease-in-out infinite}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}.opts.long,.opts.schemas{grid-template-columns:1fr}
.opt{display:flex;align-items:center;gap:12px;text-align:left;background:#f8fafc;border:4px solid #e2e8f0;border-radius:20px;padding:14px 16px;font-size:1.25rem;font-weight:800;box-shadow:0 5px 0 #cbd5e1;transition:transform .1s}
.opt:hover:not(:disabled){border-color:#a78bfa;background:#f5f3ff}
.opt .lt{flex:none;width:34px;height:34px;border-radius:50%;background:#e0e7ff;color:#4338ca;display:grid;place-items:center;font-size:1rem}
.opt.ok{background:#dcfce7;border-color:var(--go);box-shadow:0 5px 0 var(--go2);animation:pop .4s}
.opt.ok .lt{background:var(--go);color:#fff}
.opt.ko{background:#fee2e2;border-color:#fca5a5;box-shadow:none;opacity:.75;animation:shake .4s}
.opt:disabled{cursor:default}
.opts.schemas .opt{flex-direction:row;padding:10px}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.shake{animation:shake .4s}
.inrow{display:flex;justify-content:center;align-items:center;gap:10px;margin:10px 0}
.inbox{min-width:170px;text-align:center;font-family:"Fredoka",sans-serif;font-size:2.4rem;font-weight:700;background:#f8fafc;border:4px dashed #a5b4fc;border-radius:20px;padding:6px 18px}
.inbox.ok{border:4px solid var(--go);background:#dcfce7}.inbox.ko{border:4px solid #fca5a5;background:#fee2e2}
.inbox .ph{color:#c7d2fe}.unit{font-weight:800;font-size:1.3rem;color:var(--muted)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:330px;margin:10px auto 4px}
.pad button{font-family:"Fredoka",sans-serif;font-size:1.7rem;font-weight:700;border:none;border-radius:18px;padding:12px 0;background:#e0e7ff;box-shadow:0 5px 0 #a5b4fc}
.pad .del{background:#fee2e2;box-shadow:0 5px 0 #fca5a5}.pad .okk{background:var(--go);color:#fff;box-shadow:0 5px 0 var(--go2)}
.fb{display:flex;gap:12px;align-items:center;border-radius:20px;padding:12px 16px;margin-top:16px}
.fb p{margin:4px 0 0;font-weight:700}.fb b{font-size:1.2rem}
.fb.good{background:#dcfce7;border:3px solid #86efac}.fb.miss{background:#e0f2fe;border:3px solid #7dd3fc}.fb.hint{background:var(--hint);border:3px solid #fcd34d;font-size:1.6rem}.fb.hint div{font-size:1rem}
.next{display:block;margin:14px auto 0}
.reader .ttype,.ttype{display:inline-block;background:#ffedd5;color:#c2410c;border-radius:20px;padding:3px 12px;font-weight:800;font-size:.85rem}
.ttext p{font-size:1.25rem;line-height:1.7;margin:10px 0}
.relire{background:#fff7ed;border-radius:16px;padding:6px 12px;margin-bottom:10px}.relire summary{font-weight:800;cursor:pointer;color:#c2410c}.relire .ttext p{font-size:1.05rem}
.enonce{display:flex;gap:14px;align-items:center;background:#eff6ff;border-radius:20px;padding:14px;margin:10px 0}
.enonce p{margin:0;font-size:1.3rem;font-weight:700;line-height:1.5}.pbemo{font-size:54px;flex:none}
.track{display:flex;align-items:center;justify-content:center;margin:10px 0}
.tk{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#f1f5f9;font-size:20px;border:3px solid #e2e8f0;filter:grayscale(1);opacity:.6}
.tk.cur{filter:none;opacity:1;border-color:#3b82f6;transform:scale(1.2);background:#dbeafe}.tk.done{filter:none;opacity:1;background:#dcfce7;border-color:var(--go)}
.tkl{width:22px;height:4px;background:#e2e8f0}
.log{list-style:none;padding:0;margin:6px 0;font-weight:700;color:#166534;font-size:.95rem}
.step h3{text-align:center}
.solution{background:linear-gradient(135deg,#fef9c3,#dcfce7);border-radius:20px;padding:14px;text-align:center}
.sol{font-family:"Fredoka",sans-serif;font-size:1.6rem;font-weight:700;margin:6px 0}.phrase{font-size:1.15rem;font-weight:700}
.results{text-align:center}.medal{font-size:120px;animation:spin 1s cubic-bezier(.2,1.4,.4,1)}
@keyframes spin{from{transform:rotate(-200deg) scale(0)}to{transform:none}}
.starsrow{font-size:2rem;letter-spacing:4px}.starsrow span{display:inline-block;animation:pop .4s backwards}
.rbtns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:12px}
.newb{background:#fef3c7;border-radius:20px;padding:10px;margin:10px 0}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.badge{background:#fff;border-radius:20px;padding:14px;text-align:center;display:flex;flex-direction:column;gap:4px;opacity:.6;box-shadow:0 6px 0 rgba(30,27,75,.08)}
.badge span{font-size:48px}.badge small{color:var(--muted);font-weight:700}.badge em{font-size:.75rem;color:var(--muted)}
.badge.on{opacity:1;background:linear-gradient(160deg,#fff,#fef3c7);border:3px solid #fcd34d}
.toast{position:fixed;left:50%;top:18%;transform:translateX(-50%);background:linear-gradient(135deg,#f97316,#ef4444);color:#fff;font-family:"Fredoka",sans-serif;font-size:2rem;font-weight:700;padding:14px 26px;border-radius:30px;z-index:20;animation:pop .4s,fade 1.8s forwards;pointer-events:none}
@keyframes fade{80%{opacity:1}to{opacity:0;transform:translate(-50%,-30px)}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:30}
.draft{position:fixed;inset:0;background:rgba(30,27,75,.5);z-index:15;display:grid;place-items:center;padding:12px}
.draftbox{background:#fff;border-radius:24px;width:min(760px,100%);height:min(560px,88vh);display:flex;flex-direction:column;padding:10px}
.drafttop{display:flex;justify-content:space-between;align-items:center;padding:4px 6px 10px}
.draftbox canvas{flex:1;width:100%;border-radius:14px;border:3px dashed #c7d2fe;touch-action:none;background:#fff}
.money{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}
.bill{width:96px;height:52px;border-radius:8px;display:grid;place-items:center;font-family:"Fredoka",sans-serif;font-weight:700;font-size:1.2rem;color:#1e1b4b;border:3px solid rgba(0,0,0,.25);box-shadow:inset 0 0 0 4px rgba(255,255,255,.5)}
.b500{background:#d1d5db}.b1000{background:#fca5a5}.b2000{background:#93c5fd}.b5000{background:#fdba74}
.coin{border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.95rem;border:3px solid rgba(0,0,0,.25)}
.c200{width:64px;height:64px;background:radial-gradient(circle,#facc15 52%,#d1d5db 54%)}.c100{width:60px;height:60px;background:radial-gradient(circle,#e5e7eb 52%,#facc15 54%)}
.c50,.c20,.c10{width:54px;height:54px;background:#fbbf24}.c20{width:50px;height:50px}.c10{width:46px;height:46px}
.c5,.c2,.c1{width:44px;height:44px;background:#d97706;color:#fff}
.prow{display:grid;grid-template-columns:minmax(120px,1.3fr) 2fr 52px 34px;gap:8px;align-items:center;margin:6px 0;font-size:.95rem;font-weight:700}
.prow small{color:var(--muted)}.pbar{height:14px;background:#e5e7eb;border-radius:8px;overflow:hidden}.pbar i{display:block;height:100%;border-radius:8px}
.diag{background:#eff6ff;border-radius:14px;padding:10px 14px;font-weight:700}
.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.95rem}td,th{padding:8px;border-bottom:2px solid #eef2ff;text-align:center}td:first-child{text-align:left;font-weight:800}
.small{font-size:.88rem;color:var(--muted)}
ul{padding-left:22px}li{margin:4px 0}
@media (max-width:560px){body{font-size:17px}h1{font-size:1.8rem}.opts{grid-template-columns:1fr}.qtext{font-size:1.3rem}.opt{font-size:1.1rem;padding:12px}.iemo{font-size:52px}.avas{grid-template-columns:repeat(4,1fr)}.enonce p{font-size:1.12rem}.pbemo{font-size:40px}.who span:last-child{max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.prow{grid-template-columns:1fr 1.4fr 44px}.prow small{display:none}.ttext p{font-size:1.12rem}.medal{font-size:96px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.askov{position:fixed;inset:0;z-index:50;background:rgba(20,20,40,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.askbox{background:var(--card,#fff);color:var(--ink,#1e1b4b);border-radius:18px;padding:20px;max-width:420px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.3);display:flex;flex-direction:column;gap:12px;font-size:1.05rem}
.askbox.wide{max-width:640px}.askbox p{margin:0;font-weight:700}.askbox .askmsg{font-weight:400;font-size:.9rem;opacity:.8}
.askbox textarea{width:100%;min-height:220px;font:inherit;font-size:.9rem;padding:10px;border-radius:10px;border:1px solid var(--line,#ccd);background:var(--bg,#f6f6fa);color:inherit}
.askbtns{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.askbtns button{font:inherit;font-weight:700;border-radius:12px;padding:10px 18px;cursor:pointer;border:1px solid var(--line,#ccd);background:var(--bg,#f1f2f8);color:inherit}
.askbtns .askyes{background:var(--accent,#22c55e);border-color:var(--accent,#22c55e);color:var(--accent-ink,#fff)}
</style>

<body>
<div id="app"></div>
<canvas id="fx"></canvas>
<script>
/* ---- boîtes de dialogue et copie intégrées (compatibles iPad / iPhone / pages publiées) ---- */
function askOK(msg,yes){const d=document.createElement("div");d.className="askov";d.innerHTML='<div class="askbox" role="dialog" aria-modal="true"><p></p><div class="askbtns"><button type="button" class="askno">Annuler</button><button type="button" class="askyes">Confirmer</button></div></div>';d.querySelector("p").textContent=msg;document.body.appendChild(d);d.querySelector(".askno").onclick=()=>d.remove();d.querySelector(".askyes").onclick=()=>{d.remove();yes()};d.querySelector(".askyes").focus()}
function showText(txt,title){const d=document.createElement("div");d.className="askov";d.innerHTML='<div class="askbox wide" role="dialog" aria-modal="true"><b></b><textarea readonly></textarea><p class="askmsg">Appuie sur « Copier », puis colle le texte dans un message, des notes ou un e-mail.</p><div class="askbtns"><button type="button" class="askno">Fermer</button><button type="button" class="askyes">Copier</button></div></div>';d.querySelector("b").textContent=title||"Texte à copier";const ta=d.querySelector("textarea");ta.value=txt;document.body.appendChild(d);d.querySelector(".askno").onclick=()=>d.remove();d.querySelector(".askyes").onclick=()=>{const m=d.querySelector(".askmsg");const fb=()=>{ta.focus();ta.select();try{ta.setSelectionRange(0,txt.length)}catch(e){}m.textContent="Le texte est sélectionné : utilise « Copier » de ton appareil."};try{navigator.clipboard.writeText(txt).then(()=>{m.textContent="✓ Copié !"},fb)}catch(e){fb()}}}

/* ================= TEXTES DE LECTURE (originaux) ================= */
const TEXTS=[
{id:"t1a",l:1,title:"Le chaton de Lina",emo:"🐱",type:"Récit",body:"Lina a trouvé un petit chaton gris derrière la boulangerie. Il miaulait très fort et il tremblait de froid. Lina l'a pris dans ses bras et l'a ramené à la maison.\n\nSa maman a d'abord froncé les sourcils, puis elle a souri. Elle a donné au chaton un peu d'eau, quelques croquettes et une vieille couverture. Le chaton s'est endormi tout de suite.\n\n« Comment allons-nous l'appeler ? » a demandé Lina. Son petit frère a crié : « Nuage ! Parce qu'il est tout gris ! »",
qs:[
{q:"Où Lina a-t-elle trouvé le chaton ?",o:["Derrière la boulangerie","Dans le jardin","À l'école","Dans la forêt"],e:"C'est écrit dans la première phrase : « derrière la boulangerie »."},
{q:"Pourquoi le chaton tremblait-il ?",o:["Il avait froid","Il avait peur d'un chien","Il était en colère","Il venait de se réveiller"],e:"Le texte dit : « il tremblait de froid »."},
{q:"Qui a choisi le nom du chaton ?",o:["Le petit frère de Lina","Lina","La maman","Le boulanger"],e:"C'est le petit frère qui crie : « Nuage ! »"},
{q:"Au début, la maman « fronce les sourcils ». Cela veut dire qu'elle…",o:["n'est pas très d'accord","est très joyeuse","a mal aux yeux","va pleurer"],e:"Froncer les sourcils montre qu'on n'est pas content ou pas d'accord. Mais ensuite, elle sourit !"},
{q:"Pourquoi le chaton s'appelle-t-il Nuage ?",o:["Parce qu'il est tout gris","Parce qu'il est très léger","Parce qu'il est tombé du ciel","Parce qu'il aime la pluie"],e:"Le petit frère l'explique : « Parce qu'il est tout gris ! » comme un nuage de pluie."}]},
{id:"t1b",l:1,title:"Le potager de Papi Jules",emo:"🥕",type:"Récit",body:"Papi Jules a un potager derrière sa maison. Au printemps, il plante des graines de carottes, de radis et de salades.\n\nTous les soirs, Tom l'aide à arroser les plantes avec un petit arrosoir vert. Les radis poussent très vite : trois ou quatre semaines suffisent ! Les carottes, elles, prennent beaucoup plus de temps.\n\nEn été, Tom et Papi ramassent les légumes et préparent une grande salade pour toute la famille.",
qs:[
{q:"À quelle saison Papi Jules plante-t-il les graines ?",o:["Au printemps","En hiver","En automne","En été"],e:"« Au printemps, il plante des graines. »"},
{q:"Que fait Tom tous les soirs ?",o:["Il arrose les plantes","Il ramasse les carottes","Il plante des graines","Il prépare la salade"],e:"« Tous les soirs, Tom l'aide à arroser les plantes. »"},
{q:"Quel légume pousse le plus vite ?",o:["Les radis","Les carottes","Les salades","Les tomates"],e:"Les radis : trois ou quatre semaines suffisent. (Il n'y a pas de tomates dans le texte !)"},
{q:"De quelle couleur est l'arrosoir ?",o:["Vert","Rouge","Bleu","Jaune"],e:"« un petit arrosoir vert »."},
{q:"Qui est Papi Jules pour Tom ?",o:["Son grand-père","Son voisin","Son professeur","Son frère"],e:"« Papi » est un mot affectueux pour dire « grand-père »."}]},
{id:"t1c",l:1,title:"Le dragon qui avait peur du noir",emo:"🐉",type:"Conte",body:"Dans une grotte, au sommet de la montagne, vivait un petit dragon nommé Flamèche. Tous les dragons crachent du feu, mais Flamèche, lui, avait un secret : il avait peur du noir !\n\nChaque soir, il allumait une petite flamme pour éclairer sa grotte. Une nuit, un hibou entra. « Pourquoi gardes-tu une lumière ? » demanda-t-il. Flamèche rougit.\n\nLe hibou sourit : « Moi, j'adore la nuit. Viens, je vais te montrer les étoiles. » Ce soir-là, Flamèche découvrit que le noir pouvait être très beau.",
qs:[
{q:"Où vit Flamèche ?",o:["Dans une grotte au sommet de la montagne","Dans un château","Au fond de la mer","Dans une forêt"],e:"Première phrase : « Dans une grotte, au sommet de la montagne »."},
{q:"Quel est le secret de Flamèche ?",o:["Il a peur du noir","Il ne sait pas voler","Il ne crache pas de feu","Il aime les hiboux"],e:"« il avait un secret : il avait peur du noir ! »"},
{q:"Qui entre dans la grotte ?",o:["Un hibou","Un chevalier","Un autre dragon","Une chauve-souris"],e:"« Une nuit, un hibou entra. »"},
{q:"« Flamèche rougit. » Que ressent-il ?",o:["De la gêne, un peu de honte","De la colère","De la joie","De la faim"],e:"On rougit quand on est gêné… et un dragon aussi, apparemment !"},
{q:"Qu'apprend Flamèche à la fin ?",o:["Que le noir peut être très beau","Qu'il faut toujours garder une lumière","Que les hiboux sont dangereux","Qu'il doit quitter sa grotte"],e:"Grâce aux étoiles, Flamèche découvre la beauté de la nuit."}]},

{id:"t2a",l:2,title:"Le mystère du goûter disparu",emo:"🥞",type:"Récit (enquête)",body:"Ce mercredi, Maman avait préparé des crêpes pour le goûter. Elle les avait posées sur la table de la cuisine, puis elle était descendue chercher la confiture à la cave.\n\nQuand elle est remontée, l'assiette était vide ! Sur le carrelage, il y avait des traces de pattes pleines de sucre. Ces traces menaient jusqu'au panier de Biscotte.\n\nBiscotte dormait, roulée en boule, le museau tout blanc. Léo a éclaté de rire : « Je crois que nous avons trouvé le voleur ! »",
qs:[
{q:"Pourquoi Maman est-elle descendue à la cave ?",o:["Pour chercher la confiture","Pour chercher Biscotte","Pour ranger les crêpes","Pour chercher du sucre"],e:"« elle était descendue chercher la confiture à la cave »."},
{q:"Qui a mangé les crêpes ?",o:["Biscotte","Léo","Maman","Personne, elles sont tombées"],e:"Les traces mènent au panier de Biscotte, et son museau est blanc de sucre !"},
{q:"Qui est Biscotte, d'après les indices ?",o:["Un animal de la maison","La petite sœur de Léo","Une voisine","Une poupée"],e:"Des pattes, un panier, un museau : Biscotte est sûrement un chien ou un chat. Le texte ne le dit pas : c'est toi qui le devines !"},
{q:"Quel indice montre que Biscotte a mangé les crêpes ?",o:["Son museau est tout blanc","Elle aboie très fort","Elle a mal au ventre","Elle a laissé un mot"],e:"Le sucre blanc des crêpes est resté sur son museau. Les traces de pattes sont aussi un indice."},
{q:"Comment réagit Léo ?",o:["Il rit","Il pleure","Il se fâche","Il a peur"],e:"« Léo a éclaté de rire »."}]},
{id:"t2b",l:2,title:"Le manchot empereur",emo:"🐧",type:"Documentaire",body:"Le manchot empereur est le plus grand de tous les manchots : il peut mesurer plus d'un mètre de haut. Il vit en Antarctique, une terre glacée près du pôle Sud.\n\nLe manchot ne sait pas voler, mais c'est un excellent nageur : il plonge très profond pour attraper sa nourriture.\n\nEn hiver, la femelle pond un seul œuf. C'est le mâle qui le garde au chaud sur ses pattes, sous un repli de peau, pendant environ deux mois, sans manger ! Pour résister au froid et au vent, les manchots se serrent les uns contre les autres.",
qs:[
{q:"Où vit le manchot empereur ?",o:["En Antarctique, près du pôle Sud","Au pôle Nord","En Afrique","Dans les montagnes"],e:"« Il vit en Antarctique, une terre glacée près du pôle Sud »."},
{q:"Qui garde l'œuf au chaud ?",o:["Le mâle","La femelle","Les deux à tour de rôle","Personne"],e:"« C'est le mâle qui le garde au chaud sur ses pattes »."},
{q:"Pendant combien de temps environ ?",o:["Deux mois","Deux jours","Deux semaines","Deux ans"],e:"« pendant environ deux mois, sans manger ! »"},
{q:"Pourquoi les manchots se serrent-ils les uns contre les autres ?",o:["Pour résister au froid et au vent","Pour jouer","Pour se battre","Pour dormir debout"],e:"C'est écrit dans la dernière phrase."},
{q:"Ce texte est …",o:["un documentaire : il sert à apprendre","un conte de fées","une recette","un poème"],e:"Il donne des informations vraies sur un animal : c'est un documentaire."}]},
{id:"t2c",l:2,title:"Le concours de cabanes",emo:"🛖",type:"Récit",body:"Samedi, toute la classe de CE2 participait au grand concours de cabanes dans le bois. Chaque équipe avait deux heures et le droit d'utiliser seulement des branches, des feuilles et de la ficelle.\n\nL'équipe de Maya voulait construire la cabane la plus haute. Mais au bout d'une heure, le toit s'est effondré ! Au lieu de se disputer, les enfants ont réfléchi ensemble. Ils ont planté des branches plus solides, en croix, et ils ont recommencé.\n\nIls n'ont pas gagné le prix de la plus haute cabane, mais le jury leur a remis le prix de la meilleure équipe.",
qs:[
{q:"Combien de temps chaque équipe avait-elle ?",o:["Deux heures","Une heure","Une journée","Trente minutes"],e:"« Chaque équipe avait deux heures »."},
{q:"Quels matériaux étaient autorisés ?",o:["Des branches, des feuilles et de la ficelle","Des planches et des clous","Du carton et de la colle","Des pierres et du sable"],e:"« seulement des branches, des feuilles et de la ficelle »."},
{q:"Que s'est-il passé au bout d'une heure ?",o:["Le toit s'est effondré","Il a commencé à pleuvoir","L'équipe a gagné","Maya s'est blessée"],e:"« au bout d'une heure, le toit s'est effondré ! »"},
{q:"Pourquoi le jury leur a-t-il donné le prix de la meilleure équipe ?",o:["Parce qu'ils ont travaillé ensemble sans se disputer","Parce que leur cabane était la plus haute","Parce qu'ils ont fini les premiers","Parce que Maya connaissait le jury"],e:"Le texte ne le dit pas directement : on le comprend car ils ont réfléchi ensemble « au lieu de se disputer »."},
{q:"Qu'est-ce qu'un « jury » ?",o:["Les personnes qui choisissent les gagnants","Une sorte de cabane","Un outil pour couper les branches","L'équipe de Maya"],e:"Un jury est un groupe de personnes qui juge un concours."}]},

{id:"t3a",l:3,title:"Le voyage de la graine",emo:"🌼",type:"Récit",body:"Je suis une petite graine de pissenlit. Je suis accrochée à une sorte de minuscule parachute tout blanc. Un matin de printemps, un enfant a soufflé très fort sur ma fleur, et le vent m'a emportée.\n\nJ'ai survolé un champ, une rivière, puis le toit d'une école. J'ai fini par atterrir dans une fente du trottoir, entre deux pavés. Il y avait un peu de terre, et le lendemain, il a plu.\n\nAlors, doucement, j'ai sorti une racine, puis deux petites feuilles. Les passants ne me remarquent pas encore. Mais dans quelques semaines, une fleur jaune comme un soleil poussera ici, au milieu de la ville.",
qs:[
{q:"Qui raconte cette histoire ?",o:["Une graine de pissenlit","Un enfant","Le vent","Un passant"],e:"« Je suis une petite graine de pissenlit » : la graine parle à la première personne (« je »)."},
{q:"À quoi sert le « parachute » de la graine ?",o:["À être transportée par le vent","À se protéger de la pluie","À faire joli","À attraper les insectes"],e:"Grâce à lui, le vent emporte la graine loin de sa fleur. C'est ainsi que les pissenlits voyagent !"},
{q:"Dans quel ordre la graine survole-t-elle ces lieux ?",o:["Un champ, une rivière, le toit d'une école","Une rivière, un champ, une école","Le toit d'une école, un champ, une rivière","Un champ, une école, une rivière"],e:"« J'ai survolé un champ, une rivière, puis le toit d'une école. »"},
{q:"De quoi la graine a-t-elle eu besoin pour commencer à pousser ?",o:["D'un peu de terre et de pluie","De beaucoup de soleil seulement","D'un pot de fleurs","D'engrais"],e:"Il y avait « un peu de terre » et « il a plu » : alors la racine est sortie."},
{q:"« Une fleur jaune comme un soleil » : comment appelle-t-on cette façon d'écrire ?",o:["Une comparaison","Une question","Une liste","Une erreur"],e:"Avec « comme », on compare la fleur au soleil : c'est une comparaison. Les écrivains en utilisent beaucoup !"}]},
{id:"t3b",l:3,title:"Le message codé",emo:"🔐",type:"Récit (énigme)",body:"Ce matin, Inès a trouvé un papier glissé sous la porte de sa chambre. Dessus, on pouvait lire : 10 - 1 - 18 - 4 - 9 - 14.\n\nEn dessous, quelqu'un avait écrit : A = 1, B = 2, C = 3…\n\nInès a pris un crayon et elle a réfléchi. Le 10, c'était J. Le 1, c'était A. Après quelques minutes, elle a compris le message et elle a couru dehors. Derrière le vieux chêne, son grand frère l'attendait avec un grand sourire et une boîte enveloppée de papier doré.\n\nC'était le jour de son anniversaire !",
qs:[
{q:"Quel mot est caché dans le code 10 - 1 - 18 - 4 - 9 - 14 ?",o:["JARDIN","JAUNES","JOUETS","CADEAU"],e:"J (10), A (1), R (18), D (4), I (9), N (14) : JARDIN ! Compte sur tes doigts dans l'alphabet pour vérifier."},
{q:"Qui a sans doute écrit le message ?",o:["Le grand frère d'Inès","Inès elle-même","Sa maîtresse","Un voleur"],e:"C'est lui qui attend Inès au jardin avec un cadeau : c'est sûrement lui l'auteur du message."},
{q:"Pourquoi le grand frère a-t-il fait un message codé ?",o:["Pour préparer une surprise d'anniversaire","Pour faire peur à Inès","Pour qu'elle fasse ses devoirs","Parce qu'il ne sait pas écrire"],e:"La dernière phrase révèle tout : c'était son anniversaire !"},
{q:"Avec le même code, que veut dire 3 - 1 - 4 - 5 - 1 - 21 ?",o:["CADEAU","CABANE","BATEAU","CACHÉE"],e:"C (3), A (1), D (4), E (5), A (1), U (21) : CADEAU. Bravo, détective !"},
{q:"Que montre Inès dans cette histoire ?",o:["Qu'elle sait réfléchir et chercher seule","Qu'elle n'aime pas les surprises","Qu'elle a peur du noir","Qu'elle ne sait pas lire"],e:"Elle prend un crayon, réfléchit et décode le message : elle est patiente et logique."}]},
{id:"t3c",l:3,title:"Les volcans",emo:"🌋",type:"Documentaire",body:"Sous nos pieds, très profondément, la Terre est si chaude que certaines roches fondent : elles forment le magma. Parfois, ce magma remonte vers la surface par des fissures. Quand il sort d'un volcan, on l'appelle la lave.\n\nUne éruption peut être calme, avec des coulées de lave qui avancent lentement, ou explosive, avec des nuages de cendres projetés très haut dans le ciel.\n\nEn France, la chaîne des Puys, en Auvergne, compte de nombreux volcans endormis depuis des milliers d'années. Sur l'île de La Réunion, le Piton de la Fournaise, lui, est l'un des volcans les plus actifs du monde.",
qs:[
{q:"Comment appelle-t-on le magma quand il sort du volcan ?",o:["La lave","La cendre","La fissure","La roche"],e:"« Quand il sort d'un volcan, on l'appelle la lave. »"},
{q:"Quelles sont les deux sortes d'éruptions décrites ?",o:["Calme et explosive","Chaude et froide","Rapide et invisible","Grande et petite"],e:"Calme (coulées de lave) ou explosive (nuages de cendres)."},
{q:"Où se trouve le Piton de la Fournaise ?",o:["Sur l'île de La Réunion","En Auvergne","À Paris","En Antarctique"],e:"Dernier paragraphe : « Sur l'île de La Réunion »."},
{q:"Les volcans de la chaîne des Puys sont …",o:["endormis depuis des milliers d'années","en éruption tous les jours","sous la mer","très jeunes"],e:"« endormis depuis des milliers d'années »."},
{q:"Dans le texte, « les roches fondent » veut dire qu'elles …",o:["deviennent liquides à cause de la chaleur","disparaissent","se cassent en morceaux","deviennent froides"],e:"Fondre, c'est passer de l'état solide à l'état liquide, comme un glaçon au soleil."}]}

/* ================= OUTILS ================= */
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const fmt=n=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g," ");
const euros=c=>{const e=Math.floor(c/100),r=c%100;return r?`${fmt(e)},${String(r).padStart(2,"0")} €`:`${fmt(e)} €`};
function numOpts(ans,cands,f){f=f||fmt;const s=new Set([ans]),out=[ans];
  for(const c of cands){if(out.length>=4)break;if(Number.isInteger(c)&&c>=0&&!s.has(c)){s.add(c);out.push(c)}}
  let k=1;while(out.length<4){for(const c of [ans+k,ans-k]){if(out.length<4&&c>=0&&!s.has(c)){s.add(c);out.push(c)}}k++}
  return out.map(f)}
const hm=(h,m)=>m?`${h} h ${String(m).padStart(2,"0")}`:`${h} h`;

/* nombres en lettres (orthographe recommandée de 1990 : traits d'union partout) */
const UN=["zéro","un","deux","trois","quatre","cinq","six","sept","huit","neuf","dix","onze","douze","treize","quatorze","quinze","seize","dix-sept","dix-huit","dix-neuf"];
const DIZ={2:"vingt",3:"trente",4:"quarante",5:"cinquante",6:"soixante"};
function w99(n){if(n<20)return UN[n];const t=Math.floor(n/10),u=n%10;
  if(t<=6)return DIZ[t]+(u===0?"":u===1?"-et-un":"-"+UN[u]);
  if(t===7)return "soixante"+(u===1?"-et-onze":"-"+UN[10+u]);
  if(t===8)return u===0?"quatre-vingts":"quatre-vingt-"+UN[u];
  return "quatre-vingt-"+UN[10+u]}
function words(n){if(n===0)return"zéro";const p=[],m=Math.floor(n/1000),r=n%1000,c=Math.floor(r/100),d=r%100;
  if(m)p.push(m===1?"mille":w99(m)+"-mille");
  if(c)p.push(c===1?"cent":UN[c]+"-cent"+(d===0?"s":""));
  if(d)p.push(w99(d));
  return p.join("-")}

function clockSVG(h,m){
  let s=`<svg viewBox="0 0 200 200" width="190" height="190" role="img" aria-label="horloge"><circle cx="100" cy="100" r="93" fill="#fff" stroke="#4338ca" stroke-width="7"/>`;
  for(let i=0;i<60;i++){const a=i*Math.PI/30,r1=i%5?82:76;s+=`<line x1="${(100+86*Math.sin(a)).toFixed(1)}" y1="${(100-86*Math.cos(a)).toFixed(1)}" x2="${(100+r1*Math.sin(a)).toFixed(1)}" y2="${(100-r1*Math.cos(a)).toFixed(1)}" stroke="#4338ca" stroke-width="${i%5?1.4:3.2}"/>`}
  for(let i=1;i<=12;i++){const a=i*Math.PI/6;s+=`<text x="${(100+63*Math.sin(a)).toFixed(1)}" y="${(100-63*Math.cos(a)+7).toFixed(1)}" text-anchor="middle" font-size="19" font-weight="800" fill="#1e1b4b">${i}</text>`}
  const ha=((h%12)+m/60)*Math.PI/6,ma=m*Math.PI/30;
  s+=`<line x1="100" y1="100" x2="${(100+70*Math.sin(ma)).toFixed(1)}" y2="${(100-70*Math.cos(ma)).toFixed(1)}" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/>`;
  s+=`<line x1="100" y1="100" x2="${(100+43*Math.sin(ha)).toFixed(1)}" y2="${(100-43*Math.cos(ha)).toFixed(1)}" stroke="#e11d48" stroke-width="9" stroke-linecap="round"/>`;
  return s+`<circle cx="100" cy="100" r="7" fill="#1e1b4b"/></svg><div class="vis-cap"><span style="color:#e11d48">■</span> petite aiguille : les heures · <span style="color:#2563eb">■</span> grande aiguille : les minutes</div>`}
function blocksSVG(c,d,u){
  const cs=6,H=cs*10;let x=4,s="";
  for(let i=0;i<c;i++){s+=`<g transform="translate(${x},4)"><rect width="${H}" height="${H}" fill="#fbbf24" stroke="#92400e" stroke-width="1.5"/>`;for(let k=1;k<10;k++)s+=`<line x1="${k*cs}" y1="0" x2="${k*cs}" y2="${H}" stroke="#b45309" stroke-width=".6"/><line x1="0" y1="${k*cs}" x2="${H}" y2="${k*cs}" stroke="#b45309" stroke-width=".6"/>`;s+=`</g>`;x+=H+8}
  if(c)x+=6;
  for(let i=0;i<d;i++){s+=`<g transform="translate(${x},4)"><rect width="${cs}" height="${H}" fill="#34d399" stroke="#065f46" stroke-width="1.2"/>`;for(let k=1;k<10;k++)s+=`<line x1="0" y1="${k*cs}" x2="${cs}" y2="${k*cs}" stroke="#065f46" stroke-width=".6"/>`;s+=`</g>`;x+=cs+5}
  if(d)x+=8;

/* ================= CONJUGAISON GÉNÉRÉE ================= */
const VERBS=["chanter","jouer","danser","parler","marcher","regarder","sauter","dessiner","porter","rêver","tomber","gagner","cuisiner","bricoler","compter","grimper","siffler"];
const PRON=[["Je",0],["Tu",1],["Il",2],["Elle",2],["On",2],["Nous",3],["Vous",4],["Ils",5],["Elles",5]];
const NSUBJ=[["Le chat",2],["Ma sœur",2],["Les enfants",5],["Mes parents",5],["Léa et moi",3],["Toi et ton frère",4],["La maîtresse",2],["Les oiseaux",5]];
const TENSES={present:["e","es","e","ons","ez","ent"],futur:["erai","eras","era","erons","erez","eront"],imparfait:["ais","ais","ait","ions","iez","aient"]};
const TLAB={present:"au présent",futur:"au futur",imparfait:"à l'imparfait"};
function genConj(L){
  const v=pick(VERBS),rad=v.slice(0,-2),t=L===1?"present":L===2?pick(["present","present","futur"]):pick(["futur","imparfait","imparfait"]);
  const subj=L===1?pick(PRON):pick(Math.random()<.5?PRON:NSUBJ);
  const forms=TENSES[t].map(x=>rad+x),ok=forms[subj[1]];
  let others=[...new Set(forms)].filter(f=>f!==ok);
  if(L===3){const other=t==="futur"?"imparfait":"futur";others.push(rad+TENSES[other][subj[1]])}
  others=shuffle(others).slice(0,3);
  const pm=["je","tu","il","nous","vous","ils"][subj[1]];const isP=PRON.some(x=>x[0]===subj[0]);
  return{sk:"conjugaison",q:`${subj[0]} … (${v}, ${TLAB[t]})`,o:[ok,...others],e:`${isP?"":`« ${subj[0]} » se conjugue comme « ${pm} ». `}${subj[0]} ${ok}. ${TLAB[t].charAt(0).toUpperCase()+TLAB[t].slice(1)}, les terminaisons sont : ${TENSES[t].map(x=>"-"+x).join(", ")}.`}
}

function normQ(q,src){const o=q.o?q.o.map(String):null;return{type:q.input?"input":"qcm",q:q.q,o,order:o?shuffle(o.map((_,i)=>i)):null,ans:q.ans,unit:q.unit||"",vis:q.vis||(q.v?`<div class="emo">${q.v}</div>`:""),e:q.e,sk:q.sk||src,id:q.id||null,tries:0,res:null,buf:"",wrong:[]}}
function pickFixed(bank,L,n,w){const pool=bank.map((q,i)=>Object.assign({id:w+i},q)).filter(q=>q.l===L);const seen=S.seen[w]||[];return shuffle(pool).sort((a,b)=>seen.indexOf(a.id)-seen.indexOf(b.id)).slice(0,n)}
function markSeen(w,ids){S.seen[w]=((S.seen[w]||[]).filter(x=>!ids.includes(x)).concat(ids)).slice(-40)}

  if(w==="monde"){const f=pickFixed(MO,L,8,"mo");markSeen("mo",f.map(q=>q.id));return f.map(q=>normQ(q))}
  if(w==="calc"){const main=L===1?C1:L===2?C2:C3,low=L===1?C1:L===2?C1:C2;const g=shuffle(main).slice(0,6).concat(shuffle(low).slice(0,2));return shuffle(g).map(f=>normQ(f()))}
  if(w==="prob"){const n=L===3?4:5;const out=[];for(let i=0;i<n;i++)out.push({type:"pb",pb:genProblem(L),si:0,tries:0,log:[],res:null,buf:"",wrong:[]});return out}

  body+=`<div class="qtools"><span class="tag">${SKILLS[it.sk]||""}</span>${canSpeak()?`<button class="ic sm" onclick="speakQ()" title="Écouter">🔈</button>`:""}<button class="ic sm" onclick="openDraft()" title="Brouillon">✏️</button></div><div class="qtext">${esc(it.q)}</div>${it.vis?`<div class="vis">${it.vis}</div>`:""}`;
  if(it.type==="qcm"){body+=`<div class="opts ${it.o.some(x=>x.length>26)?"long":""}">`+it.order.map((oi,k)=>{let c="opt";if(it.res){if(oi===0)c+=" ok";else if(it.wrong.includes(oi))c+=" ko"}else if(it.wrong.includes(oi))c+=" ko";return `<button class="${c}" ${it.res||it.wrong.includes(oi)?"disabled":""} onclick="answer(${oi})"><span class="lt">${"ABCD"[k]}</span>${esc(it.o[oi])}${it.res&&oi===0?" ✓":""}</button>`}).join("")+`</div>`}
  else body+=keypad(it);

function keypad(it){return `<div class="inrow"><div class="inbox ${it.res==="miss"?"ko":it.res?"ok":""}" id="inbox">${it.res==="miss"?fmt(it.ans):(it.buf?fmt(+it.buf):"<span class='ph'>?</span>")}</div>${it.unit?`<span class="unit">${it.unit}</span>`:""}</div>${it.res?"":`<div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button onclick="key('${n}')">${n}</button>`).join("")}<button class="del" onclick="key('del')">⌫</button><button onclick="key('0')">0</button><button class="okk" onclick="key('ok')">OK</button></div>`}`}
function feedbackHTML(it){
  if(it.res==="star"||it.res==="ok")return `<div class="fb good pop">${owl("wow",64)}<div><b>${pick(PRAISE)} ${it.res==="star"?"⭐ +1":""}</b><p>${esc(it.e)}</p></div></div><button class="big go next" onclick="next()">Continuer ➜</button>`;
  if(it.res==="miss")return `<div class="fb miss pop">${owl("think",64)}<div><b>Voici la bonne réponse.</b><p>${esc(it.e)}</p></div></div><button class="big go next" onclick="next()">J'ai compris ➜</button>`;
  if(it.tries>0)return `<div class="fb hint pop">💡 <div><b>${pick(ENC)}</b><p>${HINTS[it.sk]||HINTS.def}</p></div></div>`;
  return ""}
function afterPlayRender(){try{document.activeElement&&document.activeElement.blur()}catch(e){}}
function speakQ(){const it=run.items[run.i];if(it.type==="pb"){speak(it.pb.text+". "+it.pb.steps[it.si].title.replace(/^[^\wÀ-ÿ]+/,""));return}let t=it.q;if(it.type==="qcm")t+=". "+it.order.map((oi,k)=>"Réponse "+"ABCD"[k]+" : "+it.o[oi]).join(". ");speak(t)}
function score(it,first){if(first){it.res="star";run.streak++;run.maxStreak=Math.max(run.maxStreak,run.streak);S.stars++;bumpStars();sGood();if(run.streak>=3&&run.streak%3===0){const k=run.streak;setTimeout(()=>toast(`🔥 Série de ${k} !`),300)}}else{it.res="ok";run.streak=0;sGood()}}
function stat(sk,ok){const s=S.sk[sk]||(S.sk[sk]={n:0,ok:0});s.n++;if(ok)s.ok++}
function answer(oi){const it=run.items[run.i];if(it.res)return;
  if(oi===0){stat(it.sk,it.tries===0);score(it,it.tries===0)}
  else{it.tries++;it.wrong.push(oi);run.streak=0;sBad();if(it.tries>=2){it.res="miss";stat(it.sk,false)}}
  save();rerenderQ()}
function key(k){const it=run.items[run.i];if(it.type==="pb")return pbKey(k);if(it.res)return;
  if(k==="del")it.buf=it.buf.slice(0,-1);else if(k==="ok"){if(!it.buf)return;checkInput(it)}else if(it.buf.length<6)it.buf+=k;
  const b=$("#inbox");if(b&&!it.res&&k!=="ok")b.innerHTML=it.buf?fmt(+it.buf):"<span class='ph'>?</span>"}
function checkInput(it){if(+it.buf===it.ans){stat(it.sk,it.tries===0);score(it,it.tries===0)}else{it.tries++;run.streak=0;sBad();it.buf="";if(it.tries>=2){it.res="miss";stat(it.sk,false)}else{const b=$("#inbox");if(b){b.classList.add("shake");setTimeout(()=>b.classList.remove("shake"),500)}}}save();rerenderQ()}
function rerenderQ(){render()}
function next(){sClick();run.i++;if(run.i>=run.items.length)return finish();render();window.scrollTo(0,0)}
function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1800)}
document.addEventListener("keydown",e=>{if(view.s!=="play"||!run||run.phase==="read")return;if(e.target.tagName==="INPUT")return;const it=run.items[run.i];if(!it)return;
  if(/^[0-9]$/.test(e.key)){const step=it.type==="pb"?it.pb.steps[it.si]:null;if(it.type==="input"||(step&&step.input&&!it.stepDone))key(e.key);return}

  const idx="abcd".indexOf(e.key.toLowerCase());if(idx>=0&&it.type==="qcm"&&!it.res&&idx<it.order.length&&!it.wrong.includes(it.order[idx]))answer(it.order[idx]);});

const lc1=t=>t.charAt(0).toLowerCase()+t.slice(1);
const STEPICON={s_question:"🔍",s_inutile:"🗑️",s_schema:"📊",s_calc:"🧮",s_first:"🪜",s_mid:"✏️",s_result:"✏️"};
function problemHTML(it){
  const pb=it.pb,n=run.items.indexOf(it)+1;

  h+=`<div class="track">`+pb.steps.map((s,i)=>`<span class="tk ${i<it.si||(i===it.si&&it.stepDone)?"done":i===it.si?"cur":""}">${STEPICON[s.k]}</span>`).join(`<span class="tkl"></span>`)+`</div>`;
  if(it.log.length)h+=`<ul class="log">${it.log.map(l=>`<li>✅ ${l}</li>`).join("")}</ul>`;
  if(it.finished){h+=`<div class="solution pop"><h3>${it.res==="star"?"🎉 Enquête résolue du premier coup ! ⭐":"✅ Enquête résolue !"}</h3>${pb.schema?`<div class="vis">${pb.schema}</div>`:""}<div class="sol">${pb.sol.split("\n").map(esc).join("<br>")}</div><p class="phrase">💬 <b>Je réponds par une phrase :</b> ${esc(pb.phrase)}</p></div><button class="big go next" onclick="next()">${run.i+1<run.items.length?"Enquête suivante ➜":"Voir mon trésor ➜"}</button></div>`;return h}
  const s=pb.steps[it.si];
  h+=`<div class="step"><h3>${s.title}</h3>`;
  if(s.input){h+=`<div class="inrow"><div class="inbox ${it.stepDone?(it.stepMiss?"ko":"ok"):""}" id="inbox">${it.stepDone?fmt(s.ans):(it.buf?fmt(+it.buf):"<span class='ph'>?</span>")}</div>${s.unit?`<span class="unit">${s.unit}</span>`:""}</div>${it.stepDone?"":`<div class="pad">${[1,2,3,4,5,6,7,8,9].map(k=>`<button onclick="key('${k}')">${k}</button>`).join("")}<button class="del" onclick="key('del')">⌫</button><button onclick="key('0')">0</button><button class="okk" onclick="key('ok')">OK</button></div>`}`}
  else{if(!it.order||it.orderFor!==it.si){it.order=shuffle(s.o.map((_,i)=>i));it.orderFor=it.si}
    h+=`<div class="opts ${s.schema?"schemas":s.o.some(x=>x.length>26)?"long":""}">`+it.order.map((oi,k)=>{let c="opt";if(it.stepDone&&oi===0)c+=" ok";if(it.wrong.includes(oi))c+=" ko";return `<button class="${c}" ${it.stepDone||it.wrong.includes(oi)?"disabled":""} onclick="pbAnswer(${oi})">${s.schema?`<span class="lt">${"ABC"[k]}</span>${s.o[oi]}`:`<span class="lt">${"ABCD"[k]}</span>${esc(s.o[oi])}`}</button>`}).join("")+`</div>`}
  if(it.stepDone)h+=`<div class="fb ${it.stepMiss?"miss":"good"} pop">${owl(it.stepMiss?"think":"wow",56)}<div><b>${it.stepMiss?"Voici la bonne réponse.":pick(PRAISE)}</b><p>${stepExplain(s,pb)}</p></div></div><button class="big go next" onclick="pbNext()">Étape suivante ➜</button>`;
  else if(it.tries>0)h+=`<div class="fb hint pop">💡 <div><b>${pick(ENC)}</b><p>${HINTS[s.k]}</p></div></div>`;
  return h+`</div></div>`}
function stepExplain(s,pb){
  if(s.k==="s_question")return `On cherche : <b>${esc(lc1(s.o[0]))}</b>.`;
  if(s.k==="s_inutile")return `« ${esc(s.o[0])} » ne sert à rien pour répondre : on peut l'oublier !`;
  if(s.k==="s_schema")return `Dans ce schéma, le « ? » est bien à la place de ce qu'on cherche.`;
  if(s.k==="s_calc")return `On fait <b>${esc(s.o[0])}</b>.`;
  if(s.k==="s_first")return `D'abord : <b>${esc(lc1(s.o[0]))}</b>. Ensuite, on pourra répondre à la question.`;

function logLine(s){if(s.k==="s_question")return "On cherche : "+esc(lc1(s.o[0]));if(s.k==="s_inutile")return "Information inutile repérée";if(s.k==="s_schema")return "Schéma choisi";if(s.k==="s_calc")return "Calcul : "+esc(s.o[0]);if(s.k==="s_first")return "D'abord : "+esc(lc1(s.o[0]));if(s.k==="s_mid")return "Étape 1 : "+fmt(s.ans)+(s.unit?" "+esc(s.unit):"");return ""}
function stepStat(k,ok){const s=S.st[k]||(S.st[k]={n:0,ok:0});s.n++;if(ok)s.ok++}
function pbAnswer(oi){const it=run.items[run.i],s=it.pb.steps[it.si];if(it.stepDone)return;
  if(oi===0){stepStat(s.k,it.tries===0);it.stepDone=true;it.stepMiss=false;if(it.tries===0)sGood();else sClick()}
  else{it.tries++;it.wrong.push(oi);sBad();if(it.tries>=2){stepStat(s.k,false);it.stepDone=true;it.stepMiss=true}}
  save();render()}
function pbKey(k){const it=run.items[run.i],s=it.pb.steps[it.si];if(!s.input||it.stepDone||it.finished)return;
  if(k==="del")it.buf=it.buf.slice(0,-1);else if(k==="ok"){if(!it.buf)return;
    if(+it.buf===s.ans){stepStat(s.k,it.tries===0);it.stepDone=true;it.stepMiss=false;
      if(s.k==="s_result"){it.firstResult=it.tries===0}
      if(it.tries===0)sGood();else sClick()}
    else{it.tries++;sBad();it.buf="";if(it.tries>=2){stepStat(s.k,false);it.stepDone=true;it.stepMiss=true;if(s.k==="s_result")it.firstResult=false}}
    save();return render()}
  else if(it.buf.length<6)it.buf+=k;

  it.si++;it.tries=0;it.wrong=[];it.buf="";it.stepDone=false;it.stepMiss=false;render()}

function finish(){
  run.finished=true;const n=run.items.length,st=run.items.filter(i=>i.res==="star").length,ratio=st/n;
  const key=run.w+run.L;S.sessions++;
  if(run.w!=="defi"){S.plays[key]=(S.plays[key]||0)+1;S.best[key]=Math.max(S.best[key]||0,ratio);S.visited[run.w]=1}
  if(run.text)S.readTexts[run.text.id]=(S.readTexts[run.text.id]||0)+1;
  const before=Object.assign({},S.badges);
  const gold=w=>[1,2,3].some(L=>(S.best[w+L]||0)>=.85);
  const cond={first:S.sessions>=1,rainbow:WORLDS.every(w=>S.visited[w.id]),read3:Object.keys(S.readTexts).length>=3,plume:gold("fr"),boussole:gold("monde"),fusee:gold("calc"),loupe:S.solved>=10,sherlock:S.solved>=30,fire:run.maxStreak>=5||!!S.badges.fire,summit:WORLDS.some(w=>(S.best[w.id+3]||0)>=.85),defi:(run.w==="defi"&&st>=6)||!!S.badges.defi,gem:S.stars>=100,crown:S.stars>=300};
  BADGES.forEach(b=>{if(cond[b.id]&&!S.badges[b.id])S.badges[b.id]=new Date().toLocaleDateString("fr-FR")});
  run.newBadges=BADGES.filter(b=>S.badges[b.id]&&!before[b.id]);run.st=st;run.ratio=ratio;
  save();view={s:"results"};render();window.scrollTo(0,0);sWin();confetti(ratio>=.6?220:120);
}

/* ================= COIN DES PARENTS ================= */
function pct(s){return s&&s.n?Math.round(100*s.ok/s.n):null}
function parents(){
  const rows=WORLDS.map(w=>`<tr><td>${w.emo} ${w.name}</td>${[1,2,3].map(L=>{const b=S.best[w.id+L],p=S.plays[w.id+L]||0;return `<td>${b!=null?medalOf(b)+" "+Math.round(b*100)+" %":"—"}<br><small>${p} partie${p>1?"s":""}</small></td>`}).join("")}</tr>`).join("");
  const sks=Object.keys(S.sk).filter(k=>S.sk[k].n>=3).map(k=>({k,p:pct(S.sk[k]),n:S.sk[k].n})).sort((a,b)=>a.p-b.p);

  if(steps.filter(s=>s.n>=4).length>=3){const w=steps.filter(s=>s.n>=4).sort((a,b)=>a.p-b.p)[0];
    diag={s_question:"La difficulté principale est de <b>comprendre ce qu'on cherche</b>. Faites reformuler la question avec ses mots avant tout calcul (« On veut savoir… »).",

      s_schema:"La difficulté principale est de <b>représenter la situation</b>. Encouragez à dessiner le schéma en barres sur le brouillon : où est le tout ? où est le « ? » ?",
      s_calc:"La situation est comprise, mais le <b>choix de l'opération</b> hésite. Faites le lien schéma → calcul : tout inconnu = addition, partie inconnue = soustraction, groupes égaux = multiplication.",
      s_first:"Les problèmes <b>en deux étapes</b> posent souci : demandez « de quel nombre as-tu besoin qui n'est pas écrit ? ».",
      s_mid:"Les erreurs viennent surtout du <b>calcul intermédiaire</b> : c'est de l'inattention plus qu'un problème de raisonnement.",
      s_result:"Le raisonnement est bon ; les erreurs viennent surtout du <b>calcul final</b> : invitez à vérifier (ordre de grandeur, opération inverse)."}[w.k]+` <small>(réussite du premier coup à cette étape : ${w.p} %)</small>`}
  const bar=(lbl,p,n)=>`<div class="prow"><span>${lbl}</span><div class="pbar"><i style="width:${p}%;background:${p>=80?"#22c55e":p>=60?"#f59e0b":"#ef4444"}"></i></div><b>${p} %</b><small>${n}</small></div>`;
  return `<section class="hero small"><h1>👨‍👩‍👧 Coin des parents</h1></section>
<div class="card"><h2>Résultats par île et par niveau</h2><p class="small">Meilleur score : part des réponses justes <b>du premier coup</b>.</p><div class="tablewrap"><table><tr><th></th><th>🌱 Niv. 1</th><th>🚀 Niv. 2</th><th>🏔️ Niv. 3</th></tr>${rows}</table></div></div>
<div class="card"><h2>🕵️ Diagnostic « résolution de problèmes »</h2><p class="small">Chaque problème est découpé en étapes. On mesure la réussite du premier coup à chacune : cela montre <b>où</b> le raisonnement bloque.</p>${steps.length?steps.map(s=>bar(SKILLS[s.k],s.p,s.n)).join(""):"<p class='small'>Aucun problème résolu pour l'instant.</p>"}<p class="diag">${diag}</p></div>
<div class="card"><h2>Compétences (du plus fragile au plus solide)</h2>${sks.length?sks.map(s=>bar(SKILLS[s.k]||s.k,s.p,s.n)).join(""):"<p class='small'>Pas encore assez de réponses (3 minimum par compétence).</p>"}</div>
<div class="card"><h2>Conseils pour la résolution de problèmes</h2><ul>
<li><b>Lire deux fois</b> : une fois pour l'histoire, une fois pour les nombres.</li>
